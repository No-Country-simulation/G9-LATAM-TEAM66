services:
  # Base de Datos MySQL 8.4 LTS
  database:
    image: mysql:8.4
    container_name: mysql_energia_db
    restart: always
    command: --local-infile=1
    environment:
      MYSQL_DATABASE: energia_inteligente
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init:/docker-entrypoint-initdb.d:ro

  # Microservicio de ML (FastAPI) 
  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: ml_service_energia
    ports:
      - "8000:8000"

  # API Backend en Spring Boot (Java 25)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api_backend_energia
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/energia_inteligente?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - database
      - ml-service

  # Servidor web: publica la pagina y reenvia la API al backend
  web:
    image: nginx:alpine
    container_name: web_energia
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
