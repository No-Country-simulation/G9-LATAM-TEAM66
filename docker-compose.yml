
services:
  # Base de Datos MySQL 8.4 LTS
  database:
    image: mysql:8.4
    container_name: mysql_energia_db
    restart: always
    command: --local-infile=1
    environment:
      MYSQL_DATABASE: energia_inteligente
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # API Backend en Spring Boot (Java 25)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api_backend_energia
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/energia_inteligente?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      database:
        condition: service_healthy

volumes:
  mysql_data:
